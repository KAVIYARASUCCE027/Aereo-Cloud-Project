# Every variable has a default, so `docker compose up --build` works without a .env file.

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-certificates}:${POSTGRES_PASSWORD:-certificates}@db:5432/${POSTGRES_DB:-certificates}
  CELERY_BROKER_URL: redis://redis:6379/0
  CERTIFICATE_STORAGE_DIR: /data/certificates
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certificates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certificates}
      POSTGRES_DB: ${POSTGRES_DB:-certificates}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Append-only file on a volume: queued messages survive a Redis restart
    # (with fsync every second, up to about one second of writes can be lost).
    # PostgreSQL remains the source of truth for jobs.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. API and worker start only after it succeeds,
  # so two containers never race to apply migrations.
  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - certificates:/data/certificates
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: runtime
    # Each worker process handles one job at a time; concurrency = jobs in parallel.
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    environment: *app-environment
    volumes:
      - certificates:/data/certificates
    # `docker compose stop` sends SIGTERM, which starts Celery's warm shutdown:
    # running jobs may finish for up to this long before the process is killed.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Not started by `up`. Run with: docker compose run --rm --build tests
  # Tests use their own database (TEST_DATABASE_URL), which they drop, recreate,
  # and migrate on every run. They refuse to run against the application database.
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: ["pytest", "-v"]
    environment:
      <<: *app-environment
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-certificates}:${POSTGRES_PASSWORD:-certificates}@db:5432/${POSTGRES_DB:-certificates}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  certificates:
