[project]
name = "bulk-certificate-generator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Dependencies are locked in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: starts a real Celery worker and API process against Redis (needs TEST_REDIS_URL)",
]
